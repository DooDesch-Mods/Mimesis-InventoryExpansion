name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: DooDesch-Mods/.github/.github/workflows/mimesis-build.yml@main
    with:
      project: InventoryExpansion.csproj
      assembly: InventoryExpansion
      library: false
      mimicapi: false
      thunderstore: true
      nexus: true
      api_requirement: false
    secrets:
      WORKSPACE_TOKEN: ${{ secrets.WORKSPACE_TOKEN }}
